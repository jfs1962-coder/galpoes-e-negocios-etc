<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Cadastrar Imóvel</title>
<style>body{font-family:Arial;max-width:600px;margin:20px auto;padding:20px}input,select,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#002855;color:white;font-weight:bold;font-size:18px}</style>
</head>
<body>
<h2>Anunciar meu Imóvel</h2>
<p>Só proprietário. Todos os tipos: Galpão, Casa, Apto, Sobrado, Prédio.</p>
<form>
<input placeholder="Nome completo *" required>
<input placeholder="CPF / CNPJ *" required>
<input placeholder="WhatsApp *" required>
<input type="email" placeholder="E-mail para NFS-e Fortaleza *" required>
<small>Você receberá a nota fiscal neste e-mail</small>
<select required>
<option>Galpão</option><option>Casa</option><option>Apartamento</option>
<option>Sobrado</option><option>Prédio</option><option>Terreno</option>
</select>
<label>Comprovante opcional (IPTU/Conta) - ganha selo Verificado</label>
<input type="file">
<div style="background:#eef5ff;padding:12px;border-radius:8px;margin-top:10px">
<label><input type="checkbox" required> Declaro que sou dono deste IMÓVEL e autorizo divulgar em galpoesenegocios.com.br até pedir baixa com VENDI/ALUGUEI/PAUSAR. <a href="/regras.html">Regras</a></label>
</div>
<button type="submit">CADASTRAR MEU IMÓVEL</button>
</form>
</body>
</html>
