<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cadastrar Imóvel - Galpões e Negócios</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
.box{background:#fff;padding:16px;border-radius:16px;max-width:520px;margin:0 auto}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
#preview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
#preview div{position:relative}
#preview img{width:100%;height:85px;object-fit:cover;border-radius:8px}
#preview span{position:absolute;top:2px;right:4px;background:#000;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;font-size:12px;cursor:pointer}
.bar{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin-top:8px}
.bar div{height:100%;background:#FFD700;width:0%;transition:.3s}
</style>
</head>
<body>
<div class="box">
<h3 style="margin:0">📸 Cadastrar Imóvel - até 15 fotos</h3>
<p style="font-size:11px;color:#666">Igual Mercado Livre, o proprietário sobe sozinho</p>

<input id="titulo" placeholder="Título: Ex Galpão 300m² Utinga Santo André">
<select id="tipo"><option>Galpão</option><option>Casa</option><option>Apartamento</option><option>Prédio Comercial</option><option>Terreno</option></select>
<input id="bairro" placeholder="Bairro e Cidade: Ex Utinga - Santo André">
<input id="valor" placeholder="Valor: Ex R$ 3.500 locação">
<textarea id="desc" placeholder="Descrição completa"></textarea>
<input id="zap" placeholder="Seu WhatsApp para contato">

<label style="font-weight:bold;font-size:13px">Fotos (máximo 15 - primeira é a capa)</label>
<input type="file" id="fotos" multiple accept="image/*">
<div class="bar"><div id="progress"></div></div>
<div id="preview"></div>

<button id="btn" style="background:#111;color:#FFD700;padding:14px;width:100%;border:0;border-radius:24px;font-weight:bold;margin-top:14px;font-size:14px">SALVAR E IR PARA PAGAMENTO PIX</button>

<div style="margin-top:14px;background:#FFFBEB;border:1px dashed #c9a400;padding:10px;border-radius:10px;font-size:11px">
<b>💰 PIX CNPJ: 63.329.574/0001-28</b><br>
Galpões e Negócios Internet Ltda - ME<br>
R$ 49,90 = 1 anúncio / R$ 99,90 = 3 anúncios - 10 dias grátis
</div>
</div>

<script>
let fotosBase64=[];
const input=document.getElementById('fotos');
const preview=document.getElementById('preview');

input.addEventListener('change', async (e)=>{
  let files=[...e.target.files].slice(0,15);
  if(files.length>15){alert('Máximo 15 fotos');return}
  fotosBase64=[]; preview.innerHTML='';
  let count=0;
  for(let file of files){
    const imgBase64 = await comprimir(file);
    fotosBase64.push(imgBase64);
    preview.innerHTML+=`<div><img src="${imgBase64}"><span onclick="this.parentElement.remove()">x</span></div>`;
    count++; document.getElementById('progress').style.width=(count/files.length*100)+'%';
  }
});

function comprimir(file){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=800; let w=img.width, h=img.height;
        if(w>h){if(w>max){h*=max/w; w=max}}else{if(h>max){w*=max/h; h=max}}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',0.7));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('btn').addEventListener('click',()=>{
  if(fotosBase64.length==0){alert('Coloque pelo menos 1 foto');return}
  const imovel={
    titulo:document.getElementById('titulo').value,
    tipo:document.getElementById('tipo').value,
    bairro:document.getElementById('bairro').value,
    valor:document.getElementById('valor').value,
    desc:document.getElementById('desc').value,
    zap:document.getElementById('zap').value,
    fotos:fotosBase64,
    data:Date.now()
  };
  let lista=JSON.parse(localStorage.getItem('imoveis_galpoes')||'[]');
  lista.push(imovel);
  localStorage.setItem('imoveis_galpoes',JSON.stringify(lista));
  alert('Imóvel salvo com '+fotosBase64.length+' fotos! Agora faça o PIX CNPJ 63.329.574/0001-28');
  location.href='index.html#planos';
});
</script>
</body>
</html>
