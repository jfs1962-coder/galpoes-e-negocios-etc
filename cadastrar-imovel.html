<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastrar IMÓVEL - Só Proprietário</title>
<style>body{margin:0;font-family:Arial;background:#fff;padding:15px} .box{max-width:500px;margin:0 auto} .voltar{font-size:13px;text-decoration:none;color:#666} input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:14px} button{background:#000;color:#FFD700;font-weight:bold;border:0;padding:15px;border-radius:24px} .caixa-verde{background:#f0fdf4;border:1px dashed #86efac;padding:10px;border-radius:10px;font-size:12px}</style>
</head>
<body>
<div class="box">
<a href="/" class="voltar">← Voltar</a>
<h3 style="margin:10px 0 4px 0">Anunciar meu IMÓVEL</h3>
<p style="font-size:12px;color:#666;margin:0 0 15px 0">Só proprietário. Sem corretor. Seu WhatsApp não fica público.</p>

<input placeholder="Nome do proprietário do IMÓVEL *">
<input placeholder="CPF / CNPJ *">
<input placeholder="WhatsApp do dono *">
<input type="email" placeholder="E-mail para NFS-e de Santo André *">
<select><option>Tipo do IMÓVEL *</option><option>Galpão</option><option>Casa</option><option>Apartamento</option><option>Sobrado</option><option>Prédio</option><option>Terreno</option></select>
<input placeholder="Bairro do IMÓVEL *">
<input placeholder="Valor *">
<div class="caixa-verde">🏅 Selo Verificado: anexe IPTU/conta opcional para seu IMÓVEL aparecer primeiro <input type="file"></div>
<textarea rows="3" placeholder="Descrição do IMÓVEL..."></textarea>
<label style="font-size:12px;display:flex;gap:8px"><input type="checkbox" style="width:16px">Declaro que sou dono deste IMÓVEL e concordo com as <a href="/regras.html">Regras</a>. Vou pausar em VENDI/ALUGUEI.</label>
<button>ANUNCIAR MEU IMÓVEL - SÓ DONO</button>
</div>
</body>
</html>
