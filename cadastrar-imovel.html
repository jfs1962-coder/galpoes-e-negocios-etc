<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar IMÓVEL - Só Proprietário</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;padding:15px}
.box{background:#fff;max-width:600px;margin:0 auto;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.topo{background:#000;color:#FFD700;text-align:center;padding:12px;border-radius:8px;margin:-20px -20px 20px -20px}
.topo h2{margin:0;font-size:18px}
input,select,textarea,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:14px}
button{background:#FFD700;color:#000;font-weight:bold;font-size:18px;border:0;cursor:pointer;margin-top:15px;padding:16px}
.aviso{background:#eef5ff;padding:12px;border-radius:8px;margin-top:10px;font-size:13px;line-height:1.4;border-left:4px solid #002855}
.selo{background:#f0fff4;padding:10px;border-radius:8px;font-size:13px;border:1px dashed #00c853;margin:8px 0}
a{color:#002855}
</style>
</head>
<body>
<div class="box">
<div class="topo">
<h2>ANUNCIAR MEU IMÓVEL</h2>
<div style="font-size:11px;color:#fff;margin-top:4px">SÓ PROPRIETÁRIO • VERIFICADO COM IPTU • SEM CORRETOR</div>
</div>

<form>
<input type="text" placeholder="Nome completo do proprietário do IMÓVEL *" required>
<input type="text" placeholder="CPF / CNPJ do proprietário *" required>
<input type="text" placeholder="WhatsApp do dono do IMÓVEL *" required>
<input type="email" placeholder="E-mail para receber NFS-e de Santo André *" required>

<select required>
<option value="">Tipo do IMÓVEL *</option>
<option>Galpão</option><option>Casa</option><option>Apartamento</option>
<option>Sobrado</option><option>Prédio Comercial</option><option>Terreno</option>
</select>

<input type="text" placeholder="Bairro do IMÓVEL - ex: Vila Homero *">
<input type="text" placeholder="Valor do IMÓVEL *">

<div class="selo">
<b>🏅 Selo Verificado no seu IMÓVEL</b><br>
Anexe comprovante opcional: IPTU, conta em seu nome.
<input type="file" style="margin-top:8px">
</div>

<textarea rows="3" placeholder="Descrição do IMÓVEL..."></textarea>

<div class="aviso">
<label style="display:flex;gap:8px"><input type="checkbox" required style="width:18px"><span>Declaro que sou o proprietário deste IMÓVEL e autorizo divulgar até eu clicar em VENDI / ALUGUEI / PAUSAR. Li as <a href="/regras.html">Regras</a></span></label>
</div>

<button type="submit">✅ CADASTRAR MEU IMÓVEL - SÓ DONO</button>
</form>
<div style="text-align:center;margin-top:15px"><a href="/">← Voltar</a></div>
</div>
</body>
</html>
