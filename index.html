<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galpões & Negócios - Em Todo o Brasil</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#FF6A00">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#111}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.logo{flex-shrink:0}
.logo img{height:42px;width:42px;object-fit:contain;border-radius:8px}
.nav{display:flex;gap:8px}
.btn{border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;border:0;text-decoration:none;white-space:nowrap;display:inline-flex;cursor:pointer}
.btn-dark{background:#1e232e;color:#fff}
.btn-orange{background:#FF6A00;color:#fff}
.hero{padding:32px 18px;max-width:1100px;margin:0 auto}
.hero h1{font-size:clamp(32px,9vw,56px);line-height:.9;font-weight:900}
.hero h1 span{color:#FF6A00;display:block}
.hero p{margin-top:14px;color:#6b7280;max-width:540px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;max-width:500px}
.card{border-radius:20px;padding:16px;border:2px solid #111}
.card-orange{border-color:#FF6A00;background:#FFF6EF}
.lista{max-width:1100px;margin:0 auto;padding:20px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.galpao{border:2px solid #111;border-radius:20px;overflow:hidden}
.galpao img{width:100%;height:160px;object-fit:cover}
.galpao-body{padding:14px}
footer{border-top:1px solid #eee;padding:20px;text-align:center;color:#9ca3af;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><img src="icon-192.png" alt="G"></a>
  <div class="nav">
    <a href="#galpoes" class="btn btn-dark">Buscar Galpão</a>
    <a href="meus-imoveis.html" class="btn btn-orange">+ CADASTRAR</a>
  </div>
</header>
<div class="hero">
  <h1>Anuncie seu <span>galpão direto para empresas.</span></h1>
  <p>Plataforma onde o proprietário cadastra e a empresa fala direto com o dono. Sem intermediação.</p>
  <div class="grid">
    <div class="card"><b>SOU PROPRIETÁRIO</b><br><a href="meus-imoveis.html" class="btn btn-dark" style="width:100%;margin-top:10px">ANUNCIAR</a></div>
    <div class="card card-orange"><b style="color:#FF6A00">BUSCO GALPÃO</b><br><a href="#galpoes" class="btn btn-orange" style="width:100%;margin-top:10px">ENCONTRAR</a></div>
  </div>
</div>
<div class="lista" id="lista-galpoes"></div>
<footer>Galpões & Negócios © 2026 - www.galpoesenegocios.com.br</footer>
<script>
function carregar(){
  const lista=document.getElementById('lista-galpoes');
  const dados=JSON.parse(localStorage.getItem('galpoes')||'[]');
  if(dados.length===0){lista.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#6b7280;padding:20px">Nenhum galpão cadastrado ainda. Clique em + CADASTRAR</p>';return;}
  lista.innerHTML=dados.map(g=>`<div class="galpao"><img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d"><div class="galpao-body"><b>${g.titulo}</b><br><small>${g.cidade} - ${g.area}m² - R$${g.valor}</small><br><a href="https://wa.me/55${(g.whatsapp||'').replace(/\D/g,'')}" class="btn btn-orange" style="width:100%;margin-top:10px">FALAR COM DONO</a></div></div>`).join('');
}
carregar();
</script>
</body>
</html>
