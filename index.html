<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALPÕES E NEGÓCIOS - Grande ABC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#f2f2f2;}
.header{
  background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.75) 100%), url('banner.jpg');
  background-size: cover;
  background-position: center 35%;
  padding: 50px 20px 25px;
  text-align:center;
  border-bottom:5px solid #ffcc00;
}
.header h1{
  color:#ffcc00;
  font-size:28px;
  font-weight:900;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
}
.subtitle{
  display:inline-block;
  margin-top:14px;
  border:2px solid #ffcc00;
  color:white;
  padding:8px 18px;
  border-radius:30px;
  font-size:12px;
  font-weight:bold;
  background:rgba(0,0,0,0.55);
}
.buttons{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btn-yellow{
  background:#ffcc00;
  border:2px solid #000;
  padding:9px 16px;
  border-radius:25px;
  font-weight:900;
  font-size:12px;
}
.tabs{display:flex;background:white;border-bottom:3px solid #ffcc00;}
.tab{flex:1;padding:16px;text-align:center;font-weight:bold;background:#fff9db;}
.tab:nth-child(2){background:white;}
.offer-bar{
  background:#ffcc00;
  margin:15px auto;
  max-width:700px;
  padding:12px;
  text-align:center;
  font-weight:900;
  border-radius:8px;
  font-size:14px;
}
.filters{display:flex;gap:10px;max-width:700px;margin:0 auto;padding:0 15px;}
.filters select{flex:1;padding:12px;border-radius:8px;border:1px solid #ccc;}
</style>
</head>
<body>
<div class="header">
  <h1>🏭 GALPÕES E NEGÓCIOS</h1>
  <div class="subtitle">GRANDE ABC • APARTAMENTOS • CASAS • GALPÕES • PROPRIETÁRIO DIRETO</div>
  <div class="buttons">
    <div class="btn-yellow">🏠 APARTAMENTOS</div>
    <div class="btn-yellow">🏡 CASAS</div>
    <div class="btn-yellow">🏭 GALPÕES</div>
  </div>
</div>
<div class="tabs">
  <div class="tab">🔍 BUSCAR</div>
  <div class="tab">📢 ANUNCIAR</div>
</div>
<div style="padding:10px;">
  <div class="offer-bar">⚡ 1º ANÚNCIO GRÁTIS 10 DIAS • Depois: 1 por R$49,90 | 3 por R$99,90</div>
  <div class="filters">
    <select><option>Todos</option><option>Galpões</option></select>
    <select><option>Grande ABC</option></select>
  </div>
</div>
</body>
</html>
