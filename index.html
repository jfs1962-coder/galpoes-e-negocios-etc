<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALPÕES E NEGÓCIOS - Só Proprietário</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#222}
.topo{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid #eee}
.btn-anunciar{background:#111;color:#FFD700;padding:9px 16px;border-radius:20px;font-size:12px;text-decoration:none;font-weight:bold}
.banner{line-height:0;background:#111} .banner img{width:100%;height:180px;object-fit:cover;display:block}
.frase{text-align:center;padding:10px;font-size:11px;background:#FFFBEB}
.filtros{padding:10px 8px;border-bottom:1px solid #eee}
.pilulas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pilulas select{width:100%;padding:10px 2px;border-radius:20px;border:1px solid #ddd;background:#f6f6f6;font-size:11px;font-weight:bold;text-align:center}
.busca-linha{display:flex;gap:6px;margin-top:8px}
.busca-linha input{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:1.5px solid #111;font-size:12px}
.btn-buscar{background:#111;color:#FFD700;border:0;padding:0 14px;border-radius:24px;font-weight:bold;font-size:11px}
.vazio{text-align:center;padding:40px 20px;color:#777} .vazio b{color:#111;font-size:14px;display:block;margin-bottom:8px}
</style>
</head>
<body>
<div class="topo"><div><b>GALPÕES E NEGÓCIOS</b><div style="font-size:9px;color:#777">SÓ PROPRIETÁRIO DO IMÓVEL</div></div><a class="btn-anunciar" href="/cadastrar-imovel.html">+ ANUNCIAR IMÓVEL</a></div>

<div class="banner"><img src="banner.jpg" alt="Galpões e Negócios" onerror="this.style.display='none'"></div>
<div class="frase"><b>Só Dono do IMÓVEL Anuncia</b> • Sem Corretor • Fala Direto com Proprietário</div>

<div class="filtros">
<div class="pilulas">
<select id="cidade"><option>📍 Cidades</option><option>Santo André</option><option>São Bernardo</option><option>São Caetano</option><option>Diadema</option><option>Mauá</option></select>
<select id="tipo"><option>🏠 IMÓVEIS</option><option>Galpão</option><option>Casa</option><option>Ap</option><option>Prédio</option><option>Terreno</option></select>
<select id="operacao"><option>💰 Negócio</option><option>Locação</option><option>Venda</option></select>
</div>
<div class="busca-linha">
<input id="bairro" placeholder="🔍 Bairro do IMÓVEL...">
<button class="btn-buscar" onclick="buscar()">BUSCAR IMÓVEL</button>
</div>
</div>

<!-- AQUI NÃO TEM MAIS VILA HOMERO FIXO -->
<div id="lista" class="vazio">
<b>🔍 Nenhum IMÓVEL encontrado ainda</b>
<p style="font-size:12px;line-height:1.4">Seja o primeiro a anunciar seu IMÓVEL direto com proprietário.<br>Clique em <b>+ ANUNCIAR IMÓVEL</b></p>
</div>

<script>
function buscar(){
 var b=bairro.value.trim();
 if(!b){document.getElementById('lista').innerHTML='<div class=vazio><b>Digite um bairro</b><p>Ex: Vila Homero, Centro, Campestre</p></div>';return}
 document.getElementById('lista').innerHTML='<div class=vazio><b>Buscando IMÓVEIS em: '+b+'</b><p>Em breve conectamos no banco de dados</p></div>';
}
// Mostra IMÓVEIS salvos do cadastrar-imovel.html (se tiver)
var imoveis=JSON.parse(localStorage.getItem('meus_imoveis')||'[]');
if(imoveis.length>0){
 var html='';
 imoveis.forEach(function(im){
  html+='<div style="border:1px solid #eee;border-radius:12px;margin:8px;overflow:hidden"><img src="'+(im.foto||'banner.jpg')+'" style="width:100%;height:160px;object-fit:cover"><div style="padding:10px"><b>'+im.titulo+'</b><br><small>'+im.bairro+' • '+im.valor+'</small><div style="border:1px solid #111;padding:10px;border-radius:10px;text-align:center;margin-top:8px;font-weight:bold" onclick="alert(\'Aqui abre verificação Só Dono\')">💬 FALAR COM DONO DO IMÓVEL</div></div></div>';
 });
 document.getElementById('lista').innerHTML=html;
 document.getElementById('lista').className='';
}
</script>
</body>
</html>
