<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>galpoes&negocios</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E88E5">
<style>
body{font-family:Arial;margin:0;background:#f5f7fa}
header{background:#1E88E5;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:24px}
.filtros{background:#fff;padding:15px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
select,button{padding:10px 15px;border-radius:8px;border:1px solid #ddd;font-size:14px}
button{background:#1E88E5;color:#fff;border:none;font-weight:bold}
.card{background:#fff;margin:12px;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card h3{margin:0 0 5px;color:#1E88E5}
.tag{display:inline-block;background:#E3F2FD;color:#1E88E5;padding:3px 8px;border-radius:20px;font-size:12px;margin-right:5px}
</style>
</head>
<body>
<header>
<h1>galpoes&negocios</h1>
<p style="margin:5px 0 0;opacity:0.9">Galpões e Imóveis no ABC e SP</p>
</header>

<div class="filtros">
<select id="cidade">
<option value="todas">Todas Cidades</option>
<option value="Santo André">Santo André</option>
<option value="São Bernardo do Campo">São Bernardo do Campo</option>
<option value="São Caetano do Sul">São Caetano do Sul</option>
<option value="Mauá">Mauá</option>
<option value="Diadema">Diadema</option>
<option value="Ribeirão Pires">Ribeirão Pires</option>
<option value="São Paulo">São Paulo</option>
</select>

<select id="tipo">
<option value="todos">Todos Imóveis</option>
<option value="Galpão">Galpões</option>
<option value="Apartamento">Apartamentos</option>
<option value="Casa">Casas</option>
<option value="Terreno">Terrenos</option>
<option value="Sala Comercial">Salas Comerciais</option>
<option value="Sobrado">Sobrados</option>
</select>
<button onclick="filtrar()">Filtrar</button>
</div>

<div id="lista"></div>

<script>
const imoveis = [
{cidade:"Santo André", tipo:"Galpão", titulo:"Galpão 800m² - Vila Homero", bairro:"Vila Homero Thon", valor:"R$ 12.000/mês"},
{cidade:"São Bernardo do Campo", tipo:"Galpão", titulo:"Galpão 1200m² - Alvarenga", bairro:"Alvarenga", valor:"R$ 18.000/mês"},
{cidade:"São Caetano do Sul", tipo:"Apartamento", titulo:"Apto 3 dorms - Centro", bairro:"Centro", valor:"R$ 450.000"},
{cidade:"Mauá", tipo:"Casa", titulo:"Casa 3 dorms - Matriz", bairro:"Matriz", valor:"R$ 380.000"},
{cidade:"Diadema", tipo:"Sala Comercial", titulo:"Sala 45m² - Centro", bairro:"Centro", valor:"R$ 1.500/mês"},
{cidade:"Santo André", tipo:"Terreno", titulo:"Terreno 250m² - Camilópolis", bairro:"Camilópolis", valor:"R$ 280.000"},
{cidade:"São Paulo", tipo:"Sobrado", titulo:"Sobrado - Vila Prudente", bairro:"Vila Prudente", valor:"R$ 650.000"},
{cidade:"São Bernardo do Campo", tipo:"Apartamento", titulo:"Apto 2 dorms - Rudge Ramos", bairro:"Rudge Ramos", valor:"R$ 320.000"}
];

function mostrar(lista){
 document.getElementById("lista").innerHTML = lista.map(i=>`
  <div class="card">
   <h3>${i.titulo}</h3>
   <span class="tag">${i.cidade}</span><span class="tag">${i.tipo}</span>
   <p style="margin:8px 0 0">📍 ${i.bairro} - <b>${i.valor}</b></p>
  </div>
 `).join("") || "<p style='text-align:center;padding:30px'>Nenhum imóvel encontrado</p>";
}
function filtrar(){
 const c = document.getElementById("cidade").value;
 const t = document.getElementById("tipo").value;
 const f = imoveis.filter(i => (c=="todas"||i.cidade==c) && (t=="todos"||i.tipo==t));
 mostrar(f);
}
mostrar(imoveis);
</script>
</body>
</html>
