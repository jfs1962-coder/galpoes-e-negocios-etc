<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Galpões - Galpões & Negócios</title>
<link rel="icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#f6f6f7;color:#111;padding:0}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.logo img{height:42px;width:42px;object-fit:contain;border-radius:8px}
.btn{border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;border:0;text-decoration:none;white-space:nowrap;display:inline-flex;cursor:pointer}
.btn-dark{background:#1e232e;color:#fff}
.btn-orange{background:#FF6A00;color:#fff}
.wrap{max-width:700px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;font-weight:900;line-height:1.1;margin-bottom:8px}
.sub{color:#6b7280;font-size:14px;line-height:1.4;margin-bottom:18px}
.card{background:#fff;border:2px solid #111;border-radius:20px;padding:18px;margin-bottom:16px}
.card h3{font-size:16px;line-height:1.2;margin-bottom:6px}
.status{font-size:14px;color:#16a34a;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn-sm{border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px;border:0;cursor:pointer}
.btn-red{background:#dc2626;color:#fff}
.btn-green{background:#FF6A00;color:#fff}
.btn-gray{background:#374151;color:#fff}
.interessado{border-top:1px solid #eee;padding-top:14px;margin-top:6px;font-size:14px;line-height:1.4}
.interessado b{font-size:14px}
.link{color:#4f46e5;text-decoration:underline;font-size:15px;display:inline-block;margin-top:16px}
.form-grid{display:grid;gap:12px;margin-top:10px}
.input{width:100%;padding:13px 14px;border:2px solid #111;border-radius:12px;font-weight:600;font-size:14px}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><img src="icon-192.png" alt="G"></a>
  <div style="display:flex;gap:8px"><a href="/" class="btn btn-dark">Voltar ao site</a></div>
</header>

<div class="wrap">
  <h1>Meus Galpões Cadastrados</h1>
  <p class="sub">Gerencie seu anúncio de galpão aqui. Ative, pause ou marque como alugado/vendido.</p>

  <div id="lista"></div>

  <div class="card" style="border-style:dashed">
    <h3>+ Cadastrar novo GALPÃO</h3>
    <div class="form-grid">
      <input class="input" id="titulo" placeholder="Ex: Galpão 800m² - Fortaleza - Jangurussu">
      <input class="input" id="cidade" placeholder="Cidade">
      <input class="input" id="area" type="number" placeholder="Área em m²">
      <input class="input" id="valor" type="number" placeholder="Valor R$/mês">
      <input class="input" id="whatsapp" placeholder="WhatsApp com DDD">
      <button class="btn btn-orange" onclick="salvar()" style="width:100%;margin-top:6px">CADASTRAR GALPÃO</button>
    </div>
  </div>

  <a href="/" class="link">Voltar ao site</a>
</div>

<script>
function carregar(){
  const lista = document.getElementById('lista');
  let dados = JSON.parse(localStorage.getItem('galpoes') || '[]');
  if(dados.length===0){
    // exemplo inicial para você ver
    dados = [{titulo:'Galpão 800m² - Fortaleza - Jangurussu', cidade:'Fortaleza', area:800, valor:12000, whatsapp:'85999999999', status:'Ativo - Verificado'}];
  }
  lista.innerHTML = dados.map((g,i)=>`
    <div class="card">
      <h3>Galpão: ${g.titulo}</h3>
      <div class="status">● ${g.status || 'Ativo - Verificado'} ✅</div>
      <div class="actions">
        <button class="btn-sm btn-red" onclick="remover(${i})">🔴 VENDI</button>
        <button class="btn-sm btn-green" onclick="remover(${i})">🟠 ALUGUEI</button>
        <button class="btn-sm btn-gray" onclick="pausar(${i})">⏸️ PAUSAR</button>
      </div>
      <div class="interessado">
        <b>Interessado recente:</b> João - 85 9xxxx - Quer alugar galpão para logística
      </div>
    </div>
  `).join('');
}
function salvar(){
  const g = {
    titulo: document.getElementById('titulo').value,
    cidade: document.getElementById('cidade').value,
    area: document.getElementById('area').value,
    valor: document.getElementById('valor').value,
    whatsapp: document.getElementById('whatsapp').value,
    status: 'Ativo - Verificado'
  };
  if(!g.titulo) return alert('Digite o título do galpão');
  let dados = JSON.parse(localStorage.getItem('galpoes') || '[]');
  dados.push(g);
  localStorage.setItem('galpoes', JSON.stringify(dados));
  carregar();
  alert('Galpão cadastrado!');
}
function remover(i){
  let dados = JSON.parse(localStorage.getItem('galpoes') || '[]');
  dados.splice(i,1);
  localStorage.setItem('galpoes', JSON.stringify(dados));
  carregar();
}
function pausar(i){ alert('Galpão pausado - não aparece nas buscas'); }
carregar();
</script>
</body>
</html>
