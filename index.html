<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galpões e Negócios - ABC Paulista</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-white shadow p-4 flex justify-between items-center">
<h1 class="font-black text-xl">GALPÕES<span class="text-orange-600"> E NEGÓCIOS</span></h1>
<a href="meus-imoveis.html" class="bg-black text-white px-4 py-2 rounded-full text-sm font-bold">+ Anunciar Galpão</a>
</header>
<section class="max-w-6xl mx-auto p-6">
<div class="bg-white p-6 rounded-2xl shadow mb-6">
<h2 class="font-bold text-lg mb-4">Buscar Galpões no ABC</h2>
<div class="grid md:grid-cols-3 gap-3">
<input id="f-cidade" placeholder="Cidade: Santo André, São Bernardo..." class="border p-3 rounded-xl">
<input id="f-bairro" placeholder="Bairro (opcional)" class="border p-3 rounded-xl">
<button onclick="buscar()" class="bg-orange-600 text-white font-bold rounded-xl p-3">BUSCAR GALPÕES →</button>
</div>
</div>
<div id="lista" class="grid md:grid-cols-3 gap-4"></div>
<div id="loading" class="text-center py-10">Carregando galpões...</div>
</section>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC7pY7zOU-zUNoB-P_eRzxcU9OBAp4B9I",
  authDomain: "galpoes-e-negocios.firebaseapp.com",
  projectId: "galpoes-e-negocios",
  storageBucket: "galpoes-e-negocios.firebasestorage.app",
  messagingSenderId: "394078482486",
  appId: "1:394078482486:web:718b1c9ec6fef801426897"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let todos = [];
async function carregar(){
  const q = query(collection(db, "galpoes"), orderBy("criadoEm","desc"));
  const snap = await getDocs(q);
  todos = snap.docs.map(d=>({id:d.id, ...d.data()}));
  document.getElementById('loading').style.display='none';
  render(todos);
}
window.buscar = function(){
  const c = document.getElementById('f-cidade').value.toLowerCase();
  const b = document.getElementById('f-bairro').value.toLowerCase();
  let filtrados = todos.filter(g=>{
    const matchCidade = !c || (g.cidade||'').toLowerCase().includes(c);
    const matchBairro = !b || (g.bairro||'').toLowerCase().includes(b);
    return matchCidade && matchBairro;
  });
  render(filtrados);
}
function render(lista){
  const div = document.getElementById('lista');
  if(lista.length==0){ div.innerHTML='<p class="col-span-3 text-center text-gray-500 py-10">Nenhum galpão encontrado. Seja o primeiro a anunciar em Santo André!</p>'; return; }
  div.innerHTML = lista.map(g=>`
    <div class="bg-white rounded-2xl overflow-hidden shadow">
      <img src="${g.imagem||'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d'}" class="h-40 w-full object-cover">
      <div class="p-4">
        <p class="text-xs text-orange-600 font-bold">${g.cidade||''} - ${g.bairro||''}</p>
        <h3 class="font-bold">${g.titulo||'Galpão Comercial'}</h3>
        <p class="text-sm text-gray-500">${g.area||'?'}m² | R$ ${g.valor||'---'}/mês</p>
        <a href="https://wa.me/${(g.whatsapp||'').replace(/[^0-9]/g,'')}" target="_blank" class="mt-3 block bg-green-600 text-white text-center py-2 rounded-xl font-bold text-sm">WhatsApp</a>
      </div>
    </div>
  `).join('');
}
carregar();
</script>
</body>
</html>
