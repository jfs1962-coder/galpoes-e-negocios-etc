<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galpões & Negócios - Galpões em todo o Brasil</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1a2533">
</head>
<body class="bg-[#f8f8f7]">
<header class="bg-white border-b sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
<img src="logo.png" class="h-12 md:h-14 w-auto">
<a href="meus-imoveis.html" class="bg-[#1a2533] text-white px-6 py-2.5 rounded-full font-bold text-sm">+ Anunciar</a>
</div>
</header>
<section class="relative min-h-[520px] flex items-center">
<div class="absolute inset-0">
<img src="hero.jpg" class="w-full h-full object-cover">
<div class="absolute inset-0 bg-gradient-to-r from-[#1a2533]/90 via-[#1a2533]/60 to-transparent"></div>
</div>
<div class="relative max-w-7xl mx-auto px-6 py-12 w-full grid md:grid-cols-2 gap-10">
<div>
<h1 class="text-white text-5xl md:text-6xl font-black">GALPÕES EM<br><span class="text-orange-500">TODO O BRASIL</span></h1>
<p class="text-white/80 mt-4">Direto com o proprietário, sem comissão.</p>
</div>
<div class="bg-white rounded-[24px] p-8 shadow-2xl">
<h2 class="font-black text-xl">Encontre seu galpão</h2>
<input id="f-cidade" placeholder="Cidade: Santo André" class="w-full border-2 p-4 rounded-xl mt-4 font-bold">
<input id="f-bairro" placeholder="Bairro" class="w-full border-2 p-4 rounded-xl mt-3">
<button onclick="buscar()" class="w-full bg-orange-500 text-white font-black p-4 rounded-xl mt-4">BUSCAR GALPÕES →</button>
</div>
</div>
</section>
<section class="max-w-7xl mx-auto px-6 py-12">
<div id="loading" class="text-center py-10">Carregando...</div>
<div id="lista" class="grid md:grid-cols-3 gap-6"></div>
</section>
<section class="bg-[#1a2533] text-white py-16">
<div class="max-w-4xl mx-auto px-6 grid md:grid-cols-2 gap-6">
<div class="bg-white/5 border border-white/10 rounded-[24px] p-8">
<h3>PLANO ESSENCIAL</h3><p class="text-4xl font-black">R$49,90/mês</p>
<a class="block mt-6 bg-white text-black text-center font-black py-4 rounded-xl">ASSINAR R$49,90</a>
<p class="text-[11px] text-center mt-2 opacity-50">PIX CNPJ 63.329.574/0001-28</p>
</div>
<div class="bg-orange-500 rounded-[24px] p-8">
<h3>PLANO PRO</h3><p class="text-4xl font-black">R$99,90/mês</p>
<a class="block mt-6 bg-black text-white text-center font-black py-4 rounded-xl">ASSINAR PRO R$99,90</a>
<p class="text-[11px] text-center mt-2">PIX CNPJ 63.329.574/0001-28</p>
</div>
</div>
</section>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC7pY7zOU-zUNoB-P_eRzxcU9OBAp4B9I",
  authDomain: "galpoes-e-negocios.firebaseapp.com",
  projectId: "galpoes-e-negocios",
  storageBucket: "galpoes-e-negocios.firebasestorage.app",
  messagingSenderId: "394078482486",
  appId: "1:394078482486:web:718b1c9ec6fef801426897"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let todos=[];
async function carregar(){
  const q = query(collection(db, "galpoes"), orderBy("criadoEm","desc"));
  const snap = await getDocs(q);
  todos = snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('loading').style.display='none';
  render(todos);
}
window.buscar = function(){
  const c = document.getElementById('f-cidade').value.toLowerCase();
  const b = document.getElementById('f-bairro').value.toLowerCase();
  let f = todos.filter(g=> (!c || (g.cidade||'').toLowerCase().includes(c)) && (!b || (g.bairro||'').toLowerCase().includes(b)) );
  render(f);
}
function render(lista){
  const div = document.getElementById('lista');
  if(!lista.length){ div.innerHTML='<p class="col-span-3 text-center py-10">Nenhum galpão ainda.</p>'; return; }
  div.innerHTML = lista.map(g=>`
    <div class="bg-white rounded-[20px] overflow-hidden border">
      <img src="${g.imagem||'hero.jpg'}" class="h-48 w-full object-cover">
      <div class="p-5"><p class="text-orange-500 text-xs font-black">${g.cidade} - ${g.bairro}</p><h3 class="font-black">${g.titulo}</h3><p class="font-black text-xl mt-2">R$ ${g.valor}</p><a href="https://wa.me/${(g.whatsapp||'').replace(/[^0-9]/g,'')}" class="block mt-3 bg-green-600 text-white text-center py-2 rounded-full font-bold">WhatsApp</a></div>
    </div>
  `).join('');
}
carregar();
</script>
</body>
</html>
