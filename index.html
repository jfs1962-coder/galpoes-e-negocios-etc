<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALPÕES E NEGÓCIOS - Só Proprietário</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#fff}
.topo{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.btn-anunciar{background:#111;color:#FFD700;padding:9px 16px;border-radius:20px;font-size:12px;text-decoration:none;font-weight:bold}
.banner img{width:100%;height:190px;object-fit:cover;display:block;background:#111}
.frase{text-align:center;padding:9px;font-size:11px;background:#FFFBEB}
.filtros{padding:10px 8px;background:#fff;border-bottom:1px solid #eee}
.pilulas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pilulas select{width:100%;padding:11px 2px;border-radius:20px;border:1px solid #ddd;background:#f6f6f6;font-size:11px;font-weight:bold;text-align:center}
.busca-linha{display:flex;gap:6px;margin-top:8px}
.busca-linha input{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:1.5px solid #111;font-size:12px}
.btn-buscar{background:#111;color:#FFD700;border:0;padding:0 14px;border-radius:24px;font-weight:bold;font-size:11px;white-space:nowrap}
.vazio{text-align:center;padding:35px 18px;color:#777;line-height:1.4}
</style>
</head>
<body>
<div class="topo"><div><b>GALPÕES E NEGÓCIOS</b><div style="font-size:9px;color:#777">SÓ PROPRIETÁRIO DO IMÓVEL</div></div><a class="btn-anunciar" href="/cadastrar-imovel.html">+ ANUNCIAR</a></div>
<div class="banner"><img src="banner.jpg" alt="Galpão"></div>
<div class="frase"><b>Só Dono do IMÓVEL Anuncia</b> • Sem Corretor • Fala Direto</div>
<div class="filtros">
<div class="pilulas">
<select id="cidade"><option>📍 Cidades</option><option>Santo André</option><option>São Bernardo</option><option>São Caetano</option><option>Diadema</option><option>Mauá</option></select>
<select id="tipo"><option>🏠 IMÓVEIS</option><option>Galpão</option><option>Casa</option><option>Ap</option><option>Prédio</option><option>Terreno</option></select>
<select id="operacao"><option>💰 Negócio</option><option>Locação</option><option>Venda</option></select>
</div>
<div class="busca-linha"><input id="bairro" placeholder="🔍 Bairro do IMÓVEL..."><button class="btn-buscar" onclick="alert('Buscando: '+cidade.value+' | '+tipo.value+' | '+operacao.value+' | '+(bairro.value||'todos'))">BUSCAR IMÓVEL</button></div>
</div>
<div class="vazio"><b style="color:#111">Portal no ar! 🚀</b><br><br>Removi o Galpão Vila Homero que ficava repetindo.<br>Agora só aparece imóvel quando você cadastrar de verdade.</div>
</body>
</html>
