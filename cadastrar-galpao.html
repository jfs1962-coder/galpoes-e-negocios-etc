<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar - Galpões e Negócios</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f5f7f9]">
<header class="bg-black h-[62px] px-6 flex items-center"><a href="/"><img src="/logo.jpg" class="h-10 bg-white rounded-lg px-2 py-1"></a></header>
<div class="max-w-3xl mx-auto px-6 py-10">
  <h1 class="font-black text-[32px]">Cadastrar Galpão</h1>
  <div id="plano-info" class="mt-4 bg-[#FFD60A] rounded-xl p-4 font-bold text-[14px]"></div>
  <form class="mt-6 bg-white rounded-2xl p-6 space-y-4">
    <select id="qtd" class="w-full border p-3 rounded-lg"><option value="1">1 Galpão - R$49,90/mês</option><option value="3">3 Galpões - R$99,90/mês</option></select>
    <input class="w-full border p-3 rounded-lg" placeholder="Título do galpão">
    <input class="w-full border p-3 rounded-lg" placeholder="Cidade / Estado">
    <input class="w-full border p-3 rounded-lg" placeholder="Valor do aluguel">
    <button class="w-full bg-black text-white font-black py-3 rounded-full">CONTINUAR PARA PAGAMENTO</button>
  </form>
</div>
<script>
 const p=new URLSearchParams(location.search).get('plano');
 const q=document.getElementById('qtd'); const info=document.getElementById('plano-info');
 if(p==='3'){q.value='3'; info.innerText='Você selecionou: 3 GALPÕES por R$99,90/mês (R$33,30 cada)';}else{info.innerText='Você selecionou: 1 GALPÃO por R$49,90/mês';}
 q.addEventListener('change',e=>{info.innerText=e.target.value==='3'?'Você selecionou: 3 GALPÕES por R$99,90/mês':'Você selecionou: 1 GALPÃO por R$49,90/mês'})
</script>
</body>
</html>
