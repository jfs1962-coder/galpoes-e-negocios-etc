<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar Galpão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.topo{background:#111;color:#fff;padding:8px 16px;display:flex;justify-content:space-between;font-size:11px}.frase{background:#FFD700;color:#000;padding:6px 14px;border-radius:20px;font-weight:bold;font-size:11px}.box{background:#fff;margin:16px;border-radius:12px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:12px}.full{grid-column:1/3}.fotos{border:2px dashed #FFD700;border-radius:10px;padding:12px;text-align:center;background:#fffbe6;margin-top:12px}#preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#preview img{width:70px;height:70px;object-fit:cover;border-radius:6px}.btn{background:#111;color:#FFD700;border:none;border-radius:20px;padding:12px;width:100%;font-weight:bold;margin-top:12px;cursor:pointer}</style>
</head><body>
<div class="topo"><div>SÓ PROPRIETÁRIO • SEM COMISSÃO</div><div style="color:#FFD700">PROPRIETÁRIO DIRETO COM VOCÊ - SEM COMISSÕES</div></div>
<div style="background:#111;padding:16px;text-align:center"><div class="frase">PROPRIETÁRIO DIRETO COM VOCÊ - SEM COMISSÕES</div><h1 style="color:#fff;font-size:16px;margin-top:8px">Galpões de Todos os Tamanhos - ABC e SP - sem intermediário</h1></div>
<div class="box">
<h2 style="font-size:14px">Cadastrar Galpão</h2>
<div class="grid" style="margin-top:12px">
<input id="cidade" placeholder="Cidade *" class="full"><input id="bairro" placeholder="Bairro *"><input id="area" placeholder="Área m² *" type="number"><input id="valor" placeholder="Valor R$ *" type="number"><input id="pe" placeholder="Pé direito"><input id="docas" placeholder="Docas"><input id="piso" placeholder="Piso" class="full"><input id="whats" placeholder="WhatsApp *" class="full">
</div>
<div class="fotos"><b style="font-size:12px">FOTOS - Até 10 fotos por galpão</b><br><input type="file" id="fotos" multiple accept="image/*" onchange="ver(this)" style="margin-top:8px"><div id="contador">0 / 10 fotos</div><div id="preview"></div></div>
<button class="btn" onclick="salvar()">SALVAR E IR PARA PAGAMENTO</button>
</div>
<script>
const supa = supabase.createClient('https://SEU-PROJETO.supabase.co','SUA_ANON_KEY');
let arquivos=[]; 
function ver(input){let novos=Array.from(input.files); if(arquivos.length+novos.length>10){alert('Máximo 10 fotos'); novos=novos.slice(0,10-arquivos.length);} arquivos=arquivos.concat(novos).slice(0,10); const prev=document.getElementById('preview'); prev.innerHTML=''; arquivos.forEach(f=>{const r=new FileReader(); r.onload=e=>prev.innerHTML+=`<img src="${e.target.result}">`; r.readAsDataURL(f);}); document.getElementById('contador').innerText=arquivos.length+' / 10 fotos';}
async function salvar(){const urlParams=new URLSearchParams(window.location.search); const plano=urlParams.get('plano')||'1'; location.href=`pagar.html?plano=${plano}`;}
</script></body></html>
