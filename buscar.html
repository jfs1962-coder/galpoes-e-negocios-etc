<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscar Galpões - Galpões e Negócios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f5f5f5;overflow-x:hidden}
.top{background:#000;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:99}
.logo-box{background:#fff;padding:6px 12px;border-radius:12px;display:flex;align-items:center;flex-shrink:0}
.logo-box img{height:50px;max-width:130px;object-fit:contain;display:block}
.menu{display:flex;gap:10px;align-items:center;flex-shrink:0}
.menu a{color:#fff;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}
.btn-amarelo{background:#FFD700;color:#000!important;padding:10px 18px!important;border-radius:20px;font-size:12px!important;font-weight:900!important;white-space:nowrap;display:inline-flex}
.btn-amarelo.txt-short{display:none!important}.btn-amarelo.txt-long{display:inline!important}
.filtros{background:#fff;padding:12px;border-bottom:1px solid #e5e5e5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:70px;z-index:9}
.filtros select,.filtros input{padding:11px;border:1px solid #ddd;border-radius:10px;font-size:13px;background:#f9f9f9;flex:1;min-width:150px}
.filtros button{background:#111;color:#fff;border:0;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.aviso{max-width:1200px;margin:12px auto 0;padding:0 12px}
.aviso div{background:#fffbe6;border:1px solid #ffe58f;padding:10px 12px;border-radius:10px;font-size:11px;line-height:1.4}
.galpoes{max-width:1200px;margin:0 auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{border:1px solid #e5e5e5;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.card img{width:100%;height:170px;object-fit:cover}
.card-body{padding:12px}
.card-body h3{font-size:13px;font-weight:800;line-height:1.3}
.card-body p{font-size:11px;color:#666;margin:3px 0}
.preco{font-size:15px;font-weight:900;color:#111;margin-top:5px}
.btn-whats{width:100%;margin-top:8px;background:#111;color:#fff;border:0;padding:11px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer}
.tag{display:inline-block;background:#f3f3f3;border:1px solid #eee;padding:3px 8px;border-radius:20px;font-size:10px;margin-top:6px;margin-right:4px}
footer{background:#0a0a0a;color:#aaa;padding:18px;text-align:center;font-size:10px;line-height:1.6;margin-top:16px}
footer b{color:#fff}
@media(max-width:600px){
.logo-box img{height:42px;max-width:110px}
.btn-amarelo.txt-long{display:none!important}
.btn-amarelo.txt-short{display:inline!important}
.btn-amarelo{padding:8px 12px!important;font-size:10px!important}
.filtros{top:62px;flex-direction:column;align-items:stretch}
.filtros select,.filtros input{flex:none;min-width:100%;width:100%}
.filtros button{width:100%}
.galpoes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
  <a href="./index.html"><div class="logo-box"><img src="./logo.jpg?v=19" alt="Galpões e Negócios"></div></a>
  <div class="menu">
    <a href="./index.html">INÍCIO</a>
    <a href="./login.html">ENTRAR</a>
    <a href="./cadastro-proprietario.html" class="btn-amarelo"><span class="txt-long">ANUNCIAR GALPÃO</span><span class="txt-short">ANUNCIAR</span></a>
  </div>
</div>

<div class="filtros">
  <select id="fCidade">
  <option value="">Todas as cidades</option>
  <option>Santo André</option>
  <option>São Bernardo do Campo</option>
  <option>São Caetano do Sul</option>
  <option>Diadema</option>
  <option>Mauá</option>
  <option>Ribeirão Pires</option>
  <option>Rio Grande da Serra</option>
  <option>São Paulo</option>
  <option>São Paulo - Zona Sul</option>
  <option>São Paulo - Zona Leste</option>
  <option>São Paulo - Zona Norte</option>
  <option>São Paulo - Zona Oeste</option>
  <option>Guarulhos</option>
  <option>Osasco</option>
  <option>Barueri</option>
  <option>Embu das Artes</option>
  <option>Taboão da Serra</option>
  <option>Itapevi</option>
  <option>Cotia</option>
  </select>
  <select id="fTipo"><option value="">Monousuário ou Condomínio</option><option value="monousuario">Monousuário</option><option value="condominio">Condomínio</option></select>
  <select id="fMetros"><option value="">Qualquer metragem</option><option value="200">Até 200m²</option><option value="500">200 a 500m²</option><option value="1000">500 a 1000m²</option><option value="1001">Acima de 1000m²</option></select>
  <input id="fPreco" type="number" placeholder="Preço até R$">
  <button onclick="filtrar()">FILTRAR</button>
</div>

<div class="aviso"><div>🔒 <b>CNPJ 63.329.574/0001-28:</b> Você está logado e vê os contatos direto do proprietário. Sem comissão.</div></div>
<div id="lista" class="galpoes"></div>
<footer><b>Galpões e Negócios® - Marca Registrada</b><br>CNPJ 63.329.574/0001-28 - Plataforma direta proprietário<br>© 2026 Galpões e Negócios. Todos os direitos reservados.</footer>

<script>
// ====== BLOQUEIO OBRIGATÓRIO - SE NÃO LOGADO, MANDA PRA CADASTRO ======
(function(){
  const logado = localStorage.getItem('usuario_logado');
  if(!logado){
    alert('🔒 Você precisa se cadastrar com nome, email e senha para ver os galpões.');
    localStorage.setItem('redirect_after_login','buscar');
    location.href='./cadastro-cliente.html?origem=busca';
    return;
  }
})();
// =====================================================================

const demo=[
  {titulo:"Galpão 450m² Monousuário - 2 docas - Fabril 380m²",cidade:"Santo André",bairro:"Vila Industrial",metros:450,area_fabril:380,preco:5800,tipo:"monousuario",pe:"7m",docas:2,foto:"./hero.jpg?v=19",whats:"5511999999999"},
  {titulo:"Galpão 800m² Condomínio - 4 docas - Fabril 700m²",cidade:"São Bernardo do Campo",bairro:"Batistini",metros:800,area_fabril:700,preco:9500,tipo:"condominio",pe:"8m",docas:4,foto:"./hero.jpg?v=19",whats:"5511999999999"}
];

function getAll(){
  const salvos=JSON.parse(localStorage.getItem('gn_galpoes')||'[]');
  return salvos.length?salvos:demo;
}

function render(lista){
  const div=document.getElementById('lista');
  if(!lista.length){div.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;color:#666">Nenhum galpão com esses filtros.</div>';return}
  div.innerHTML=lista.map((g,i)=>`
    <div class="card">
      <img src="${g.foto}" onerror="this.src='./hero.jpg?v=19'">
      <div class="card-body">
        <h3>${g.titulo||`Galpão ${g.metros||g.area_construida||g.area}m² em ${g.cidade}`}</h3>
        <p>${g.bairro||''} - ${g.cidade} • ${g.metros||g.area_construida||''}m² ${g.area_fabril?`• Fabril ${g.area_fabril}m²`:''}</p>
        <div><span class="tag">${(g.tipo||'monousuario').toUpperCase()}</span><span class="tag">Pé ${g.pe_direito||g.pe||'7m'}</span><span class="tag">${g.docas||2} DOCAS</span></div>
        <div class="preco">R$ ${Number(g.preco||g.valor||0).toLocaleString('pt-BR')}/mês</div>
        <button class="btn-whats" onclick="verWhatsapp(${i})">💬 Ver WhatsApp do Proprietário</button>
      </div>
    </div>`).join('');
}

function verWhatsapp(index){
  const g=getAll()[index];
  const num=(g.whats||'').replace(/\D/g,'');
  window.open(`https://wa.me/${num||'5511999999999'}?text=Olá! Vi seu galpão de ${g.metros||g.area_construida}m² em ${g.cidade} no Galpões e Negócios®. Ainda está disponível?`,'_blank');
}

function filtrar(){
  const cidade=document.getElementById('fCidade').value;
  const tipo=document.getElementById('fTipo').value;
  const metros=document.getElementById('fMetros').value;
  const preco=document.getElementById('fPreco').value;
  let lista=getAll();
  if(cidade) lista=lista.filter(g=> (g.cidade||'').toLowerCase().includes(cidade.toLowerCase()));
  if(tipo) lista=lista.filter(g=> (g.tipo||'')===tipo);
  if(metros){
    const m=Number(metros);
    lista=lista.filter(g=>{
      const met=Number(g.metros||g.area_construida||g.area||0);
      if(m===200) return met<=200;
      if(m===500) return met>200&&met<=500;
      if(m===1000) return met>500&&met<=1000;
      if(m===1001) return met>1000;
      return true;
    });
  }
  if(preco) lista=lista.filter(g=> Number(g.preco||g.valor||0)<=Number(preco));
  render(lista);
}

// aplica filtro que veio da home
function aplicarFiltroDaHome(){
  const params=new URLSearchParams(window.location.search);
  const cidade=params.get('cidade');
  const metros=params.get('metros');
  const preco=params.get('preco');
  if(cidade) document.getElementById('fCidade').value=cidade;
  if(metros) document.getElementById('fMetros').value=metros;
  if(preco) document.getElementById('fPreco').value=preco;
  if(cidade||metros||preco) filtrar();
  else render(getAll());
}

aplicarFiltroDaHome();
</script>
</body>
</html>
