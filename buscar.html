<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscar Galpões - Galpões e Negócios - ABC e SP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f7f7f7}
.top{background:#000;color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo-box{background:#fff;padding:6px 12px;border-radius:12px;display:flex;align-items:center}
.logo-box img{height:56px;filter:contrast(1.2)}
.top a{color:#fff;text-decoration:none;font-weight:800;font-size:12px;margin-left:14px}
.btn-amarelo{background:#FFD700;color:#000;padding:10px 18px;border-radius:22px;font-weight:900;text-decoration:none;font-size:12px}
.layout{display:flex;max-width:1400px;margin:0 auto}
.filtros{width:300px;background:#fff;border-right:1px solid #e5e5e5;padding:20px;min-height:calc(100vh - 76px);position:sticky;top:76px;align-self:flex-start}
.filtros h4{font-size:11px;font-weight:900;margin:18px 0 8px;letter-spacing:.5px}
.filtros select,.filtros input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:12px;margin-top:6px}
.count{font-size:12px;color:#111;font-weight:800;background:#fffbe0;border:1px solid #FFD700;padding:10px;border-radius:10px;margin-bottom:12px}
.cards{flex:1;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-content:start}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e5e5e5;box-shadow:0 4px 12px rgba(0,0,0,.06);display:flex;flex-direction:column}
.card-img{height:190px;background:#ddd;background-size:cover;background-position:center;position:relative}
.selo{position:absolute;top:10px;left:10px;background:#FFD700;color:#000;font-size:9px;font-weight:900;padding:6px 9px;border-radius:20px}
.card-body{padding:14px}
.preco{font-weight:900;font-size:18px}
.meta{font-size:11px;color:#666;margin-top:6px;line-height:1.6}
.meta b{color:#111}
.btn-wpp{margin-top:12px;background:#000;color:#FFD700;width:100%;border:0;padding:12px;border-radius:10px;font-weight:900;cursor:pointer;font-size:12px}
footer{grid-column:1/-1;background:#0a0a0a;color:#aaa;padding:24px;font-size:11px;line-height:1.6;text-align:center;border-radius:12px;margin-top:20px}
footer a{color:#FFD700;text-decoration:none;margin:0 8px}
@media(max-width:900px){.layout{flex-direction:column}.filtros{width:100%;position:relative;top:0;min-height:auto}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
  <a href="./index.html"><div class="logo-box"><img src="./logo.png" onerror="this.src='./logo.jpg'"></div></a>
  <div>
    <a href="./index.html">INÍCIO</a>
    <a href="./painel.html">MEUS GALPÕES</a>
    <a href="./cadastro-proprietario.html" class="btn-amarelo">ANUNCIAR</a>
  </div>
</div>

<div class="layout">
  <div class="filtros">
    <div class="count" id="count">Carregando...</div>
    
    <h4>CIDADE / REGIÃO</h4>
    <select id="fCidade" onchange="filtrar()">
      <option value="">Todas do ABC e SP</option>
      <option value="Santo André">Santo André</option>
      <option value="São Bernardo">São Bernardo do Campo</option>
      <option value="São Caetano">São Caetano do Sul</option>
      <option value="Diadema">Diadema</option>
      <option value="Mauá">Mauá</option>
      <option value="São Paulo">São Paulo</option>
    </select>

    <h4>METRAGEM</h4>
    <select id="fMetragem" onchange="filtrar()">
      <option value="">Qualquer tamanho</option>
      <option value="0-300">Até 300m²</option>
      <option value="300-600">300 a 600m²</option>
      <option value="600-99999">Acima de 600m²</option>
    </select>

    <h4>PREÇO MÁXIMO</h4>
    <input type="number" id="fPreco" placeholder="Ex: 5000" oninput="filtrar()">

    <div style="margin-top:20px;background:#fffbe0;padding:12px;border-radius:10px;border:1px solid #FFD700;font-size:11px;line-height:1.4">
      <b>✓ Somente direto proprietário</b><br>Sem comissão, sem corretor. Contato direto no WhatsApp.
    </div>

    <div style="margin-top:16px;font-size:10px;color:#666">
      <b>PLANOS:</b><br>
      1 Galpão = R$49,90/mês<br>
      3 Galpões = R$99,90/mês ⭐
    </div>
  </div>

  <div class="cards" id="lista"></div>
</div>

<script>
function getGalpoes(){
  return JSON.parse(localStorage.getItem('gn_galpoes') || localStorage.getItem('galpoes') || localStorage.getItem('meus_galpoes') || '[]');
}
const demo = [
  {titulo:"Galpão 400m² com escritório", cidade:"Santo André", bairro:"Vila Pires", metros:400, preco:4500, foto:"hero.jpg", whats:"11999999999"},
  {titulo:"Galpão 250m² Rua Própria", cidade:"São Bernardo do Campo", bairro:"Rudge Ramos", metros:250, preco:3200, foto:"hero.jpg", whats:"11999999999"},
  {titulo:"Galpão 800m² com doca", cidade:"Diadema", bairro:"Centro", metros:800, preco:8900, foto:"hero.jpg", whats:"11999999999"},
];

function render(lista){
  const el = document.getElementById('lista');
  const countEl = document.getElementById('count');
  countEl.innerText = lista.length + ' galpões encontrados • direto proprietário';

  if(lista.length===0){
    el.innerHTML = `<div style="grid-column:1/-1;background:#fff;padding:20px;border-radius:12px">Nenhum galpão com esse filtro. <a href="./cadastro-proprietario.html" style="color:#000;font-weight:800">Seja o primeiro a anunciar</a>
    <footer><b style="color:#fff">Galpões e Negócios - CNPJ 00.000.000/0001-00</b><br>Não somos imobiliária. Plataforma direta proprietário.<br><a href="./termos.html">Termos</a> | <a href="./privacidade.html">Privacidade</a> | contato@galpoesenegocios.com.br</footer></div>`;
    return;
  }

  el.innerHTML = lista.map(g=>`
    <div class="card">
      <div class="card-img" style="background-image:url('${g.foto||'hero.jpg'}')"><div class="selo">DIRETO DO DONO • SEM COMISSÃO</div></div>
      <div class="card-body">
        <div class="preco">R$ ${Number(g.preco).toLocaleString('pt-BR')}/mês</div>
        <div style="font-weight:800;font-size:13px;margin-top:4px">${g.titulo||'Galpão '+g.metros+'m² em '+g.cidade}</div>
        <div class="meta">
          <b>Metragem:</b> ${g.metros} m²<br>
          <b>Bairro:</b> ${g.bairro||g.cidade}<br>
          <b>Cidade:</b> ${g.cidade}<br>
          <b>Condomínio:</b> R$ 0 (rua)
        </div>
        <button class="btn-wpp" onclick="window.open('https://wa.me/55${(g.whats||'').toString().replace(/\\D/g,'')}?text=Olá! Vi seu galpão de ${g.metros}m² em ${g.cidade} no Galpões e Negócios','_blank')">FALAR NO WHATSAPP →</button>
      </div>
    </div>
  `).join('') + `<footer><b style="color:#fff">Galpões e Negócios - CNPJ 00.000.000/0001-00</b><br>Plataforma de anúncio direto proprietário. Não somos imobiliária e não cobramos comissão.<br><a href="./termos.html">Termos de Uso</a> | <a href="./privacidade.html">Privacidade</a> | <a href="mailto:contato@galpoesenegocios.com.br">contato@galpoesenegocios.com.br</a><br>Santo André - SP - ABC Paulista<br><br>Planos: 1 Galpão R$49,90/mês | 3 Galpões R$99,90/mês</footer>`;
}

function filtrar(){
  let galpoes = getGalpoes();
  if(galpoes.length===0) galpoes = demo;
  const c = document.getElementById('fCidade').value;
  const m = document.getElementById('fMetragem').value;
  const p = parseFloat(document.getElementById('fPreco').value)||99999999;
  let f = galpoes.filter(g=>{
    if(c && !(g.cidade||'').toLowerCase().includes(c.toLowerCase())) return false;
    if(Number(g.preco) > p) return false;
    if(m){
      const [min,max] = m.split('-').map(Number);
      if(Number(g.metros) < min || Number(g.metros) > max) return false;
    }
    return true;
  });
  render(f);
}

// Ler filtros da URL ?cidade=...
(function(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('cidade')) document.getElementById('fCidade').value = params.get('cidade');
  if(params.get('metragem')) document.getElementById('fMetragem').value = params.get('metragem');
  if(params.get('preco')) document.getElementById('fPreco').value = params.get('preco');
})();
filtrar();
</script>
</body>
</html>
