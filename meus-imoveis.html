<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus Imóveis</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.topo{background:#111;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;font-size:11px}.box{background:#fff;margin:16px;border-radius:12px;padding:16px}.btn{background:#FFD700;color:#000;padding:12px;display:block;text-align:center;border-radius:20px;font-weight:bold;text-decoration:none;margin-top:10px}</style>
</head><body>
<div class="topo"><div id="user">Carregando...</div><div><a href="#" onclick="sair()" style="color:#FFD700">SAIR</a></div></div>
<div class="box"><h2>Meus Galpões</h2><p style="font-size:11px;color:#666;margin-top:6px" id="info"></p><a href="cadastrar-galpao.html" class="btn">+ ANUNCIAR NOVO GALPÃO</a><div id="lista" style="margin-top:16px"></div></div>
<script>
const supa = supabase.createClient('https://SEU-PROJETO.supabase.co','SUA_ANON_KEY');
async function init(){const {data:{user}} = await supa.auth.getUser(); if(!user){location.href='login.html';return;} document.getElementById('user').innerText=user.email; document.getElementById('info').innerText='Bem-vindo! Gerencie seus galpões aqui. Limite: 10 fotos por galpão.'; const {data}=await supa.from('galpoes').select('*').eq('email_proprietario',user.email); if(data&&data.length){document.getElementById('lista').innerHTML=data.map(g=>`<div style="border:1px solid #ddd;padding:10px;border-radius:8px;margin-top:8px">${g.cidade}-${g.bairro} - ${g.area}m²</div>`).join('');}else{document.getElementById('lista').innerHTML='<p style="font-size:12px;color:#888">Nenhum galpão ainda.</p>';}}
async function sair(){await supa.auth.signOut(); location.href='index.html';} init();
</script></body></html>
