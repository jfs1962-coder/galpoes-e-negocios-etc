<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Galpões e Negócios</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{display:flex;min-height:100vh}.esq{width:45%;background:#111;color:#fff;padding:30px;display:flex;flex-direction:column;justify-content:center}.dir{width:55%;background:#e5e5e5;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#fff;padding:28px;border-radius:16px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.15)}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:10px}button{width:100%;padding:12px;background:#111;color:#FFD700;border:0;border-radius:30px;font-weight:900;margin-top:15px;cursor:pointer}</style>
</head>
<body>
<div class="esq"><h2>Galpões e Negócios</h2><p style="margin-top:10px;font-size:13px;opacity:.8">Painel do proprietário</p></div>
<div class="dir">
<div class="box">
<h3>Entrar</h3>
<input id="email" type="email" placeholder="Seu e-mail" value="teste@teste.com">
<input id="senha" type="password" placeholder="Senha" value="123">
<button id="btn" onclick="entrar()">ENTRAR</button>
<p id="msg" style="font-size:11px;margin-top:10px;color:red;text-align:center"></p>
<a href="index.html" style="display:block;text-align:center;margin-top:12px;font-size:11px;color:#111">Voltar ao site</a>
</div>
</div>
<script>
function entrar(){
  const e=document.getElementById('email').value.trim();
  const s=document.getElementById('senha').value.trim();
  const m=document.getElementById('msg');
  if(!e||!s){m.innerText='Preencha e-mail e senha';return}
  m.style.color='green'; m.innerText='Entrando...';
  localStorage.setItem('usuario_logado', e);
  // REDIRECIONAMENTO GARANTIDO
  window.location.replace('painel.html');
}
// permite Enter
document.addEventListener('keydown',ev=>{if(ev.key==='Enter')entrar()});
</script>
</body>
</html>
