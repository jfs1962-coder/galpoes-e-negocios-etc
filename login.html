<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar - Galpões e Negócios</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#eef2f6 url('/hero.jpg') no-repeat top center; background-size:100% auto; background-attachment:fixed; font-family:Arial, sans-serif}
@media(max-width:768px){body{background-image:url('/hero-mobile.jpg'); background-size:100% auto}}
.overlay{background:rgba(238,242,246,0.88); min-height:calc(100vh - 62px)}
</style>
</head>
<body>
<header class="bg-black h-[62px] px-3 md:px-8 flex justify-between items-center sticky top-0 z-50">
  <a href="/" class="bg-white rounded-xl px-2 py-1"><img src="/logo.jpg" class="h-[40px] w-auto object-contain"></a>
  <nav class="flex items-center gap-3 md:gap-6">
    <a href="/buscar.html" class="text-white text-[12px] font-bold">BUSCAR</a>

  </nav>
</header>

<div class="overlay flex items-center justify-center p-4">
  <div class="bg-white/95 backdrop-blur rounded-[20px] p-8 w-full max-w-[420px] shadow-xl border border-zinc-100">
    <h1 class="font-black text-[22px] text-center">Entrar na sua conta</h1>
    <p class="text-[11px] text-zinc-500 text-center mt-1">GALPOES E NEGOCIOS INTERNET LTDA - ME</p>

    <button class="mt-5 w-full bg-black text-[#FFD60A] font-black p-3.5 rounded-full text-[13px]">ENTRAR</button>
    <p class="text-[11px] text-center mt-4">Não tem conta? <a href="/cadastrar-galpao.html" class="font-bold underline">Anunciar galpão</a></p>
    <p class="text-[10px] text-zinc-400 text-center mt-6">CNPJ 63.329.574/0001-28 | PIX no mesmo CNPJ</p>
  </div>
</div>

</html>
