<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar - Galpões e Negócios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px}
.box{background:#fff;border-radius:16px;padding:22px;max-width:400px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.box h1{font-size:20px;font-weight:900}.box p{font-size:12px;color:#666;margin:8px 0 16px}
.box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:13px;margin-top:8px}
.btn{background:#111;color:#FFD700;border:0;padding:13px;width:100%;border-radius:12px;font-weight:900;margin-top:14px;cursor:pointer}
.link{font-size:11px;text-align:center;margin-top:12px}.link a{font-weight:900;color:#111}
</style>
</head><body>
<div class="box">
<h1>Entrar na sua conta</h1>
<p>Se você já é cadastrado, digite seu email e senha para ver os galpões.</p>
<input id="email" type="email" placeholder="Seu email cadastrado *">
<input id="senha" type="password" placeholder="Sua senha *">
<button class="btn" onclick="entrar()">ENTRAR →</button>
<div class="link">Não tem cadastro? <a href="./cadastro-cliente.html">Cadastre-se grátis</a><br><br>Sou proprietário? <a href="./cadastro-proprietario.html">Anunciar galpão</a></div>
<p id="msg" style="font-size:11px;text-align:center;margin-top:10px;color:red"></p>
</div>
<script>
function entrar(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const senha=document.getElementById('senha').value;
  if(!email||!senha){document.getElementById('msg').innerText='Digite email e senha';return}
  const usuarios=JSON.parse(localStorage.getItem('gn_usuarios')||'[]');
  const user=usuarios.find(u=>u.email===email&&u.senha===senha);
  if(!user){document.getElementById('msg').innerText='Email ou senha incorretos';return}
  localStorage.setItem('usuario_logado',JSON.stringify(user));
  const busca=JSON.parse(localStorage.getItem('busca_pendente')||'{}');
  if(busca.cidade||busca.metros||busca.preco){
    location.href=`./buscar.html?cidade=${encodeURIComponent(busca.cidade||'')}&metros=${busca.metros||''}&preco=${busca.preco||''}`;
  } else {
    location.href='./buscar.html';
  }
}
</script>
</body></html>
