<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar - Galpões e Negócios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f5f5f5;display:flex;min-height:100vh}
.esq{
  width:45%;background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.6)),url('hero.jpg');
  background-size:cover;background-position:center;
  color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between
}
.dir{
  width:55%;display:flex;align-items:center;justify-content:center;padding:20px;
  position:relative;overflow:hidden;
  background-color:#ffffff;
  background-image: url('hero.jpg');
  background-repeat: no-repeat;
  background-position: center;
  background-size: 85%;
  background-blend-mode: luminosity;
}
.dir::before{
  content:"";position:absolute;inset:0;
  background:rgba(255,255,255,0.88);
  backdrop-filter: blur(1px);
}
.box{position:relative;z-index:2;background:#fff;width:100%;max-width:380px;padding:30px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:1px solid #eee}
input{width:100%;padding:14px 16px;border:1px solid #ddd;border-radius:12px;margin-top:10px;font-size:13px;outline:none}
input:focus{border-color:#FFD700}
.btn{width:100%;background:#111;color:#FFD700;border:0;padding:14px;border-radius:30px;font-weight:900;margin-top:16px;cursor:pointer;font-size:13px}
.link{font-size:11px;text-align:center;margin-top:14px;color:#666}
.link a{color:#111;font-weight:800;text-decoration:none}
@media(max-width:800px){body{flex-direction:column}.esq{width:100%;min-height:220px;padding:24px}.dir{width:100%}}
</style>
</head>
<body>
<div class="esq">
<div><div style="background:#fff;display:inline-block;padding:8px 12px;border-radius:10px"><img src="logo.jpg" style="height:36px"></div></div>
<div>
<h2 style="font-size:26px;line-height:1.1;font-weight:900">Bem-vindo de volta, <span style="color:#FFD700">Proprietário</span></h2>
<p style="font-size:13px;opacity:.8;margin-top:10px">Gerencie seus galpões, responda no chat protegido e receba contatos direto, sem comissão.</p>
</div>
</div>
<div class="dir">
<div class="box">
<h3 style="font-size:18px;font-weight:900;margin-bottom:4px">Entrar na sua conta</h3>
<p style="font-size:11px;color:#777;margin-bottom:16px">Acesse seu painel</p>
<input type="email" id="email" placeholder="Seu e-mail">
<input type="password" id="senha" placeholder="Sua senha">
<button class="btn" onclick="entrar()">ENTRAR →</button>
<div class="link"><a href="cadastro-proprietario.html">Criar conta gratuita</a> • <a href="index.html">Voltar ao início</a></div>
<p id="msg" style="font-size:11px;color:red;margin-top:10px;text-align:center"></p>
</div>
</div>
<script>
function entrar(){
 const e=document.getElementById('email').value, s=document.getElementById('senha').value, m=document.getElementById('msg');
 if(!e||!s){m.innerText="Preencha e-mail e senha";return}
 m.innerText="Entrando...";
 setTimeout(()=>{localStorage.setItem('usuario_logado',e); location.href='painel.html'},800)
}
</script>
</body>
</html>
