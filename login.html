<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Proprietário - Galpões e Negócios</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
<div class="bg-white rounded-[16px] p-6 w-full max-w-[400px] shadow">
<h1 class="font-black text-lg">Entrar - Proprietário</h1>
<p class="text-[11px] text-gray-500 mt-1">CNPJ 63.329.574/0001-28 - Cada CPF/CNPJ vê só seus galpões (até 3)</p>
<input id="cpf" placeholder="Digite seu CPF ou CNPJ" class="mt-5 w-full border rounded-[10px] px-4 py-3 text-sm">
<button onclick="entrar()" class="mt-4 w-full bg-black text-white font-black py-3 rounded-full text-sm">ENTRAR E VER MEUS GALPÕES</button>
<p class="mt-4 text-[10px] text-gray-400 text-center">Não compartilhamos seu documento. Usado só para separar seus anúncios dos outros clientes no mesmo PC.</p>
</div>
<script>
function entrar(){
  let doc = document.getElementById('cpf').value.replace(/\D/g,'');
  if(doc.length < 11){ alert('Digite CPF com 11 ou CNPJ com 14 dígitos'); return; }
  localStorage.setItem('gn_dono_atual', doc);
  // CORREÇÃO DO 404: usa caminho relativo correto
  window.location.href = './cadastro-proprietario.html';
}
</script>
</body>
</html>
