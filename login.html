<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrar</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50">
<div class="max-w-sm mx-auto mt-20 bg-white p-6 rounded-2xl border"><h1 class="font-black">Entrar</h1><input id="email" placeholder="E-mail" type="email" class="border w-full p-3 rounded-xl mt-3"><input id="senha" placeholder="Senha" type="password" class="border w-full p-3 rounded-xl mt-3"><button onclick="entrar()" class="bg-black text-yellow-400 w-full p-3 rounded-xl mt-4 font-bold">ENTRAR</button><p class="text-center text-xs mt-3"><a href="cadastro-proprietario.html">Criar conta</a> | <a href="index.html">Voltar</a></p><p id="msg" class="text-xs text-red-500 text-center mt-2"></p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {apiKey: "AIzaSyC7pY7zOU-zUNoB-P_eRzxcU9OBAp4B9I",authDomain: "galpoes-e-negocios.firebaseapp.com",projectId: "galpoes-e-negocios",storageBucket: "galpoes-e-negocios.firebasestorage.app",messagingSenderId: "394078482486",appId: "1:394078482486:web:718b1c9ec6fef801426897"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app);
window.entrar=async function(){try{await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('senha').value); location.href='meus-imoveis.html';}catch(e){document.getElementById('msg').innerText='E-mail ou senha errados';}}
</script></body></html>
