<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.box{background:#fff;max-width:380px;margin:40px auto;border-radius:12px;padding:20px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:10px}.btn{background:#111;color:#FFD700;border:none;width:100%;padding:12px;border-radius:20px;font-weight:bold;margin-top:14px;cursor:pointer}.topo{background:#111;color:#fff;padding:8px 16px;font-size:11px;text-align:center}</style>
</head><body>
<div class="topo">SÓ PROPRIETÁRIO • SEM COMISSÃO</div>
<div class="box"><h2>Entrar</h2><input id="email" placeholder="E-mail" type="email"><input id="senha" placeholder="Senha" type="password"><button class="btn" onclick="entrar()">ENTRAR</button><p style="text-align:center;margin-top:12px;font-size:11px"><a href="cadastro-proprietario.html">Criar conta</a> | <a href="index.html">Voltar</a></p><p id="msg" style="color:red;font-size:11px;text-align:center;margin-top:8px"></p></div>
<script>
const supa = supabase.createClient('https://SEU-PROJETO.supabase.co','SUA_ANON_KEY');
async function entrar(){
 const email=document.getElementById('email').value; const senha=document.getElementById('senha').value;
 const {error} = await supa.auth.signInWithPassword({email,password:senha});
 if(error){document.getElementById('msg').innerText='E-mail ou senha errados';return;}
 location.href='meus-imoveis.html';
}
</script></body></html>
