<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta - Galpões e Negócios</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background-color:#eef2f6; font-family:Arial,sans-serif; position:relative}
body::before{content:""; position:fixed; inset:0; background-image:url('/hero.jpg'); background-size:100% auto; background-position:top center; background-repeat:no-repeat; opacity:0.12; pointer-events:none; z-index:-1}
@media(max-width:768px){body::before{background-image:url('/hero-mobile.jpg'); opacity:0.15}}
.tab-active{border-bottom:3px solid #FFD60A; font-weight:900}
.perfil-active{background:#000; color:#fff; border-color:#000}
.input-error{border-color:#ef4444!important; background:#fef2f2!important}
</style>
</head>
<body class="min-h-screen">
<header class="bg-black h-[62px] px-3 md:px-8 flex justify-between items-center sticky top-0 z-50">
  <a href="/" class="bg-white rounded-xl px-2 py-1"><img src="/logo.jpg" class="h-[40px]"></a>
  <nav class="flex items-center gap-3"><a href="/buscar.html" class="text-white text-[12px] font-bold">BUSCAR</a><a href="/faq.html" class="text-white text-[12px] font-bold">DÚVIDAS</a><a href="/cadastrar-galpao.html" class="bg-[#FFD60A] text-black text-[11px] font-black px-4 py-2.5 rounded-full">ANUNCIAR GALPÃO</a></nav>
</header>

<div class="min-h-[calc(100vh-62px)] flex items-center justify-center p-4">
  <div class="bg-white rounded-[20px] w-full max-w-[420px] shadow-xl border border-zinc-100 overflow-hidden">
    <!-- LOGO + ABAS IGUAL PROPRIETARIO DIRETO -->
    <div class="p-6 pb-0 text-center">
      <div class="flex justify-center items-center gap-2 mb-6"><img src="/logo.jpg" class="h-9"><span class="font-black text-[13px] text-left leading-none">GALPÕES<br>& NEGÓCIOS</span></div>
      <div class="flex border-b border-zinc-200">
        <a href="/login.html" class="flex-1 py-3 text-[13px] text-zinc-500 font-bold">Entrar</a>
        <button class="flex-1 py-3 text-[13px] tab-active">Criar conta</button>
      </div>
    </div>

    <div class="p-6">
      <p class="text-[12px] font-bold mb-3">Selecione o seu perfil</p>
      <div class="flex gap-2 mb-5">
        <button id="p1" onclick="setPerfil(1)" class="perfil-active flex-1 border rounded-full py-2 px-3 text-[11px] font-bold transition-all">Proprietário</button>
        <button id="p2" onclick="setPerfil(2)" class="flex-1 border border-zinc-300 rounded-full py-2 px-3 text-[11px] font-bold bg-zinc-50">Empresa</button>
        <button id="p3" onclick="setPerfil(3)" class="flex-1 border border-zinc-300 rounded-full py-2 px-3 text-[11px] font-bold bg-zinc-50">Corretor</button>
      </div>

      <button class="w-full border border-violet-700 text-violet-800 rounded-lg py-2.5 text-[13px] font-bold flex items-center justify-center gap-2"><span class="bg-[#1877F2] text-white rounded-full w-5 h-5 flex items-center justify-center text-[12px]">f</span> Criar conta com Facebook</button>
      <button class="w-full mt-2 border border-zinc-300 rounded-lg py-2.5 text-[13px] font-bold flex items-center justify-center gap-2"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="h-4"> Criar conta com Google</button>

      <div class="flex items-center gap-3 my-5"><div class="flex-1 h-[1px] bg-zinc-200"></div><span class="text-[10px] text-zinc-400 font-bold">OU</span><div class="flex-1 h-[1px] bg-zinc-200"></div></div>

      <div class="space-y-3">
        <div>
          <label class="text-[11px] font-bold">Qual seu nome?</label>
          <div class="relative mt-1"><input id="nome" placeholder="Digite seu nome" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl py-3 px-3 pr-8 text-[13px] outline-none focus:border-black"><span class="absolute right-3 top-3 text-zinc-400">👤</span></div>
        </div>
        <div>
          <label class="text-[11px] font-bold">E-mail</label>
          <div class="relative mt-1">
            <input id="email" type="email" placeholder="Digite seu e-mail" value="jesus@invictusimoveis.com.br" class="w-full bg-zinc-50 border rounded-xl py-3 px-3 pr-8 text-[13px] outline-none input-error">
            <span class="absolute right-3 top-3 text-zinc-400">✉️</span>
          </div>
          <p class="text-[10px] text-red-500 mt-1 font-bold">Esse e-mail já está sendo utilizado. ⚠️</p>
        </div>
        <div>
          <label class="text-[11px] font-bold">Telefone celular</label>
          <div class="relative mt-1"><input placeholder="Digite seu telefone com DDD" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl py-3 px-3 pr-8 text-[13px] outline-none focus:border-black"><span class="absolute right-3 top-3 text-zinc-400">📱</span></div>
        </div>
        <div>
          <label class="text-[11px] font-bold">Senha</label>
          <div class="relative mt-1"><input id="senha" type="password" value="12345678" placeholder="Digite sua senha" class="w-full bg-zinc-50 border border-zinc-200 rounded-xl py-3 px-10 text-[13px] outline-none focus:border-black"><span onclick="toggleSenha()" class="absolute right-3 top-3 cursor-pointer text-zinc-500">👁️</span></div>
        </div>
      </div>

      <button onclick="cadastrar()" class="mt-5 w-full bg-violet-300 hover:bg-violet-400 text-white font-black py-3.5 rounded-lg text-[13px] transition-all">Cadastrar</button>

      <p class="mt-4 text-[10px] text-center leading-tight">Clicando no botão você concorda com nossos<br><a href="/termos.html" class="underline font-bold">Termos e Condições de Uso.</a></p>
      <p class="mt-3 text-[10px] text-center text-zinc-400">PIX CNPJ: 63.329.574/0001-28 • GALPOES E NEGOCIOS INTERNET LTDA - ME</p>
    </div>
  </div>
</div>

<script>
let perfil=1;
function setPerfil(p){
  perfil=p;
  [1,2,3].forEach(i=>{
    const b=document.getElementById('p'+i);
    if(i==p){b.className='flex-1 border border-black bg-black text-white rounded-full py-2 px-3 text-[11px] font-bold'}
    else{b.className='flex-1 border border-zinc-300 rounded-full py-2 px-3 text-[11px] font-bold bg-zinc-50'}
  });
}
function toggleSenha(){
  const s=document.getElementById('senha');
  s.type=s.type=='password'?'text':'password';
}
function cadastrar(){
  const email=document.getElementById('email').value;
  if(email.includes('invictus')){alert('Esse e-mail já existe. Faça login ou use outro e-mail.'); return;}
  alert('Conta criada como '+(perfil==1?'Proprietário':perfil==2?'Empresa':'Corretor')+'! Redirecionando para anunciar...');
  window.location.href='/cadastrar-galpao.html';
}
</script>
</body>
</html>
