<script>
// FUNÇÃO PARA FAZER UPLOAD DE ATÉ 10 FOTOS
async function uploadFotos(files) {
  if (files.length > 10) {
    alert('Máximo 10 fotos!');
    return [];
  }
  const urls = [];
  for (let file of files) {
    const nomeUnico = Date.now() + '-' + Math.random().toString(36).substring(7) + '-' + file.name;
    const { data, error } = await supabaseClient.storage.from(BUCKET).upload(nomeUnico, file);
    if (error) {
      console.error('Erro upload:', error);
      alert('Erro ao enviar: ' + file.name);
    } else {
      const { data: urlData } = supabaseClient.storage.from(BUCKET).getPublicUrl(nomeUnico);
      urls.push(urlData.publicUrl);
    }
  }
  return urls;
}
