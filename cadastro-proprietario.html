<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anunciar Galpão</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f6f6] min-h-screen">
<div class="max-w-[600px] mx-auto bg-white min-h-screen p-5">
<div class="flex justify-between items-center">
<h1 class="font-black text-xl">Anunciar Galpão</h1>
<button onclick="sair()" class="text-[11px] border px-3 py-1 rounded-full">Sair</button>
</div>
<p class="text-[11px] text-gray-500 mt-1">Cliente: <b id="donoTxt"></b> • Limite: <b id="limiteTxt">1</b> • CNPJ 63.329.574/0001-28</p>
<div id="aviso" class="mt-4 bg-yellow-50 border rounded-[12px] p-3 text-[11px]"></div>
<input id="titulo" placeholder="Título ex: Galpão 450m²" class="mt-4 w-full border rounded-[10px] px-4 py-3 text-sm">
<input id="cep" placeholder="CEP" maxlength="9" class="mt-2 w-full border rounded-[10px] px-4 py-3 text-sm">
<input id="rua" placeholder="Rua (auto)" class="mt-2 w-full border rounded-[10px] px-4 py-3 text-sm bg-gray-50">
<div class="grid grid-cols-2 gap-2 mt-2"><input id="bairro" placeholder="Bairro" class="border rounded-[10px] px-4 py-3 text-sm"><input id="cidade" placeholder="Cidade" class="border rounded-[10px] px-4 py-3 text-sm"></div>
<input id="metros" type="number" placeholder="Metragem m²" class="mt-2 w-full border rounded-[10px] px-4 py-3 text-sm">
<input id="preco" type="number" placeholder="Preço R$" class="mt-2 w-full border rounded-[10px] px-4 py-3 text-sm">
<button onclick="salvar()" class="mt-6 w-full bg-black text-white font-black py-4 rounded-full text-sm">SALVAR GALPÃO</button>
<button onclick="location.href='./pagar.html'" class="mt-3 w-full bg-yellow-400 text-black font-black py-3 rounded-full text-sm">UPGRADE ATÉ 3 GALPÕES - R$99,90</button>
</div>
<script>
let dono = localStorage.getItem('gn_dono_atual');
if(!dono){ window.location.href='./login.html'; }
document.getElementById('donoTxt').innerText = dono;
const chaveLista = 'gn_galpoes_' + dono;
const limite = Number(localStorage.getItem('limite_galpoes_'+dono)|| localStorage.getItem('limite_galpoes')||1);
document.getElementById('limiteTxt').innerText=limite;
let lista = JSON.parse(localStorage.getItem(chaveLista)||'[]');
document.getElementById('aviso').innerHTML = lista.length>=limite? `⚠️ Limite de ${limite} atingido` : `✅ Você pode até ${limite}. Você tem ${lista.length} ativo(s).`;

function buscarCep(v){ let cep=v.replace(/\D/g,''); if(cep.length!=8)return; fetch(`https://viacep.com.br/ws/${cep}/json/`).then(r=>r.json()).then(d=>{ if(!d.erro){ document.getElementById('rua').value=d.logradouro; document.getElementById('bairro').value=d.bairro; document.getElementById('cidade').value=d.localidade; } });}
document.getElementById('cep').addEventListener('blur', e=>buscarCep(e.target.value));

function salvar(){
 if(lista.length>=limite){ alert('Limite atingido, faça upgrade'); location.href='./pagar.html'; return; }
 let g={titulo:document.getElementById('titulo').value, rua:document.getElementById('rua').value, bairro:document.getElementById('bairro').value, cidade:document.getElementById('cidade').value, metros:document.getElementById('metros').value, preco:document.getElementById('preco').value, id:Date.now()};
 if(!g.titulo){alert('Título obrigatório');return;}
 lista.push(g); localStorage.setItem(chaveLista, JSON.stringify(lista));
 // Atualiza lista geral para o buscar.html ver
 let geral = JSON.parse(localStorage.getItem('gn_galpoes')||'[]'); geral.push(g); localStorage.setItem('gn_galpoes', JSON.stringify(geral));
 alert('Salvo!'); location.href='./buscar.html';
}
function sair(){ localStorage.removeItem('gn_dono_atual'); location.href='./login.html'; }
</script>
</body>
</html>
