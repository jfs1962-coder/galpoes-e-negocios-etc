<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anunciar</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f6f6]">
<div class="max-w-[700px] mx-auto bg-white min-h-screen p-4">
<h1 class="font-black">Anunciar Galpão</h1><p class="text-[10px] text-green-600">✓ Cadastro com tópicos leves (não cansativo)</p>
<input id="titulo" placeholder="Título *" class="mt-4 w-full border rounded-[10px] px-4 py-3 text-sm">
<details open class="mt-4 border rounded-[12px] p-3"><summary class="font-black text-[11px]">1. ÁREAS</summary><div class="grid grid-cols-2 gap-2 mt-2"><input placeholder="Área total" class="border rounded p-2 text-[12px]"><input placeholder="ABL" class="border rounded p-2 text-[12px]"><input placeholder="Fabril / Armaz." class="border rounded p-2 text-[12px]"><input placeholder="Mezanino" class="border rounded p-2 text-[12px]"><input placeholder="Marquise" class="border rounded p-2 text-[12px]"><input placeholder="Apoio" class="border rounded p-2 text-[12px]"></div></details>
<details class="mt-3 border rounded-[12px] p-3"><summary class="font-black text-[11px]">2. ESTRUTURA</summary><div class="grid grid-cols-2 gap-2 mt-2"><input placeholder="Pé-direito" class="border rounded p-2 text-[12px]"><input placeholder="Carga piso" class="border rounded p-2 text-[12px]"><input placeholder="Tipo piso" class="border rounded p-2 text-[12px]"><input placeholder="Modulação pilares" class="border rounded p-2 text-[12px]"><input placeholder="Cobertura" class="border rounded p-2 text-[12px]"><input placeholder="Iluminação/Vent." class="border rounded p-2 text-[12px]"></div></details>
<details class="mt-3 border rounded-[12px] p-3"><summary class="font-black text-[11px]">3. CARGA/DESCARGA</summary><div class="grid grid-cols-2 gap-2 mt-2"><input placeholder="Qtd docas" class="border rounded p-2 text-[12px]"><input placeholder="Tipo docas" class="border rounded p-2 text-[12px]"><input placeholder="Niveladoras" class="border rounded p-2 text-[12px]"><input placeholder="Portas nível" class="border rounded p-2 text-[12px]"><input placeholder="Pátio" class="border rounded p-2 text-[12px]"></div></details>
<details class="mt-3 border rounded-[12px] p-3"><summary class="font-black text-[11px]">4. ELÉTRICA/UTILIDADES</summary><div class="grid grid-cols-2 gap-2 mt-2"><input placeholder="kVA" class="border rounded p-2 text-[12px]"><input placeholder="Entrada energia" class="border rounded p-2 text-[12px]"><input placeholder="Água" class="border rounded p-2 text-[12px]"><input placeholder="Efluentes" class="border rounded p-2 text-[12px]"></div></details>
<details class="mt-3 border rounded-[12px] p-3"><summary class="font-black text-[11px]">5. INCÊNDIO</summary><div class="grid grid-cols-2 gap-2 mt-2"><input placeholder="Classif. risco" class="border rounded p-2 text-[12px]"><input placeholder="Sprinklers" class="border rounded p-2 text-[12px]"><input placeholder="Hidrantes" class="border rounded p-2 text-[12px]"><input placeholder="Reserva" class="border rounded p-2 text-[12px]"></div></details>
<details class="mt-3 border rounded-[12px] p-3"><summary class="font-black text-[11px]">6. CONDOMÍNIO</summary><div class="grid grid-cols-2 gap-2 mt-2"><input placeholder="Portaria" class="border rounded p-2 text-[12px]"><input placeholder="CFTV" class="border rounded p-2 text-[12px]"><input placeholder="Balança" class="border rounded p-2 text-[12px]"><input placeholder="Vagas" class="border rounded p-2 text-[12px]"></div></details>
<details class="mt-3 border rounded-[12px] p-3"><summary class="font-black text-[11px]">7. LEGAL</summary><div class="grid grid-cols-2 gap-2 mt-2"><input placeholder="Zoneamento" class="border rounded p-2 text-[12px]"><input placeholder="AVCB" class="border rounded p-2 text-[12px]"><input placeholder="Habite-se" class="border rounded p-2 text-[12px]"></div></details>
<label class="flex gap-2 mt-4 text-[10px]"><input type="checkbox" checked> Autorizo exibição do meu WhatsApp para empresas verificadas com CPF/CNPJ, com sigilo intermediado (LGPD). Não autorizo corretores.</label>
<button class="mt-6 w-full bg-black text-white font-black py-4 rounded-full">SALVAR GALPÃO</button>
</div></body></html>
