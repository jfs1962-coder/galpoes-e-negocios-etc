<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anunciar Galpão - Galpões e Negócios</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
body{background:#f5f5f5;padding:14px}
.box{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
h1{font-size:20px;font-weight:900} p{font-size:11px;color:#666;margin:6px 0 14px;line-height:1.4}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:13px;margin-top:8px}
.btn{width:100%;padding:13px;background:#111;color:#fff;border:0;border-radius:12px;font-weight:900;margin-top:14px;cursor:pointer}
.btn-amarelo{background:#FFD700;color:#000}
.aviso-plano{background:#fffbe6;border:1px solid #ffe58f;padding:10px;border-radius:10px;font-size:11px;margin-bottom:12px}
</style>
</head>
<body>
<div class="box">
<h1>Anunciar Galpão</h1>
<p>CNPJ 63.329.574/0001-28 - Galpões e Negócios® - Seu limite: <b id="limiteTxt">1</b> galpão(ões)</p>
<div id="aviso" class="aviso-plano"></div>
<input id="titulo" placeholder="Título ex: Galpão 450m² Monousuário">
<select id="cidade"><option>Santo André</option><option>São Bernardo do Campo</option><option>São Caetano do Sul</option><option>Diadema</option><option>Mauá</option><option>São Paulo</option><option>Guarulhos</option></select>
<input id="bairro" placeholder="Bairro">
<input id="metros" type="number" placeholder="Metragem total (m²)">
<input id="preco" type="number" placeholder="Preço aluguel R$">
<input id="whats" placeholder="Seu WhatsApp com DDD">
<input id="fotos" type="file" accept="image/*">
<button class="btn" onclick="salvar()">SALVAR GALPÃO</button>
<button class="btn btn-amarelo" onclick="location.href='./pagamento.html'">FAZER UPGRADE PARA 3 GALPÕES</button>
<p id="msg" style="font-size:11px;text-align:center;margin-top:10px;color:red"></p>
</div>
<script>
const limite = Number(localStorage.getItem('limite_galpoes')||1);
document.getElementById('limiteTxt').innerText=limite;
const lista=JSON.parse(localStorage.getItem('gn_galpoes')||'[]');
const aviso=document.getElementById('aviso');
if(lista.length>=limite){
aviso.innerHTML=`⚠️ Você já atingiu seu limite de <b>${limite} galpão(ões)</b>. Para anunciar até 3, faça upgrade para o PRO.`;
}else{
aviso.innerHTML=`✅ Você pode anunciar até <b>${limite}</b> galpão(ões). Você tem <b>${lista.length}</b> ativo(s).`;
}
function salvar(){
if(lista.length>=limite){alert(`Limite de ${limite} galpão(ões) atingido! Faça upgrade para PRO (até 3 galpões)`);location.href='./pagamento.html';return}
const g={titulo:document.getElementById('titulo').value,cidade:document.getElementById('cidade').value,bairro:document.getElementById('bairro').value,metros:document.getElementById('metros').value,preco:document.getElementById('preco').value,whats:document.getElementById('whats').value,foto:'./hero.jpg?v=21',tipo:'monousuario',docas:2,pe:'7m'};
lista.push(g);localStorage.setItem('gn_galpoes',JSON.stringify(lista));
alert('Galpão salvo!');location.href='./buscar.html';
}
</script>
</body>
</html>
