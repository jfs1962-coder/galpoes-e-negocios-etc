<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50">
<header class="bg-white border-b p-3 flex justify-between items-center"><a href="index.html" class="font-bold text-sm">← Voltar</a><img src="logo.png" class="h-10"></header>
<div class="max-w-xl mx-auto p-4"><div class="bg-white rounded-[24px] p-7 border shadow-sm">
<h1 class="font-black text-xl">Criar Conta - Proprietário</h1><p class="text-gray-400 text-xs mb-4">Cadastro único, depois você anuncia quantos galpões quiser</p>
<div class="grid gap-3">
<input id="nome" placeholder="Nome completo *" class="border p-4 rounded-xl">
<input id="email" placeholder="E-mail *" type="email" class="border p-4 rounded-xl">
<input id="telefone" placeholder="WhatsApp com DDD *" class="border p-4 rounded-xl">
<input id="senha" placeholder="Crie uma senha *" type="password" class="border p-4 rounded-xl">
<select id="tipoAnunciante" class="border p-4 rounded-xl font-bold"><option>Proprietário direto</option><option>Corretor / Imobiliária</option></select>
<label class="flex gap-2 text-[11px]"><input type="checkbox" id="termos"><span>Li e aceito as Regras. Sou responsável por visitas e contratos. Plataforma CNPJ 63.329.574/0001-28 é apenas vitrine.</span></label>
<button onclick="cadastrar()" id="btn" class="bg-[#1a2533] text-white p-4 rounded-xl font-black">CRIAR CONTA E CONTINUAR →</button>
<p id="msg" class="text-xs text-center text-red-500"></p>
</div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {apiKey: "AIzaSyC7pY7zOU-zUNoB-P_eRzxcU9OBAp4B9I",authDomain: "galpoes-e-negocios.firebaseapp.com",projectId: "galpoes-e-negocios",storageBucket: "galpoes-e-negocios.firebasestorage.app",messagingSenderId: "394078482486",appId: "1:394078482486:web:718b1c9ec6fef801426897"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
window.cadastrar=async function(){
 const nome=document.getElementById('nome').value; const email=document.getElementById('email').value; const tel=document.getElementById('telefone').value; const senha=document.getElementById('senha').value;
 if(!nome||!email||!tel||!senha){alert('Preencha tudo');return;}
 if(!document.getElementById('termos').checked){alert('Aceite as regras');return;}
 document.getElementById('btn').innerText='CRIANDO...';
 try{
   const cred=await createUserWithEmailAndPassword(auth,email,senha);
   const ref=await addDoc(collection(db,"proprietarios"),{nome,email,telefone:tel,tipo:document.getElementById('tipoAnunciante').value,uid:cred.user.uid,criadoEm:serverTimestamp()});
   localStorage.setItem('gn_proprietario_id',ref.id); localStorage.setItem('gn_owner',ref.id);
   location.href='cadastrar-galpao.html';
 }catch(e){document.getElementById('msg').innerText=e.message; document.getElementById('btn').innerText='CRIAR CONTA E CONTINUAR →';}
}
</script></body></html>
