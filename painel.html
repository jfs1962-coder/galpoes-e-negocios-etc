<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel</title>
<style>body{font-family:Arial;background:#f2f2f2;margin:0;padding:0}.topo{background:#111;color:#fff;padding:15px 20px;display:flex;justify-content:space-between}.card{background:#fff;margin:20px auto;max-width:900px;padding:20px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.1)}</style>
</head>
<body>
<div class="topo"><b style="color:#FFD700">Galpões e Negócios</b><button onclick="sair()" style="padding:6px 12px;border-radius:15px;border:0;cursor:pointer">Sair</button></div>
<div class="card">
<h2>Painel funcionando!</h2>
<p>Email: <b id="email"></b></p>
<p id="hora"></p>
<hr style="margin:15px 0">
<p>Se você está lendo isso, a tela branca foi corrigida.</p>
<a href="index.html">Voltar ao site</a> | <a href="cadastrar-galpao.html">Cadastrar galpão</a>
</div>
<script>
const email = localStorage.getItem('usuario_logado');
document.getElementById('email').innerText = email || 'NÃO LOGADO';
document.getElementById('hora').innerText = 'Carregado em: ' + new Date().toLocaleString();
if(!email){ document.body.innerHTML = '<div style="padding:40px;text-align:center"><h3>Faça login</h3><a href="login.html">Ir para login</a></div>'; }
function sair(){localStorage.clear(); location.href='login.html';}
</script>
</body>
</html>
